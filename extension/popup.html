<!doctype html>
<meta charset="utf-8">
<title>Potato Upload</title>
<style>
  body { margin: 0; padding: 14px 16px; width: 230px; font: 14px system-ui, sans-serif; }
  label { display: flex; align-items: center; justify-content: space-between; gap: 12px; cursor: pointer; }
  input {
    appearance: none; position: relative; flex: none; width: 40px; height: 22px; margin: 0;
    border-radius: 11px; background: #bbb; cursor: pointer; transition: background .15s;
  }
  input::after {
    content: ""; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px;
    border-radius: 50%; background: #fff; transition: left .15s;
  }
  input:checked { background: #1a73e8; }
  input:checked::after { left: 20px; }
  p { margin: 8px 0 0; color: #666; font-size: 12px; }
</style>
<label>Swap faces on upload <input type="checkbox" id="enabled"></label>
<p id="status"></p>
<script src="popup.js"></script>
